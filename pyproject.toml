[project]
name = "sticky-brain"
version = "0.1.0"
description = "A small personal memory tool for local capture, search, editing, and recovery"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["knowledge-management", "second-brain", "mcp", "semantic-search", "personal-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "mcp>=2.3,<3",
    "sentence-transformers>=6.1,<7",
    "sqlite-vec>=0.1.9,<0.2",
    "typer>=0.27.3,<0.28",
    "textual>=8.2.8,<9",
    "pydantic>=2.14,<3",
    "python-ulid>=4.0.1,<5",
    "httpx>=0.28.1,<0.29",
    "tomli-w>=1.2,<2",
    "numpy>=2.4.4,<3",
    "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
]

[project.urls]
Homepage = "https://github.com/nothans/sticky"
Repository = "https://github.com/nothans/sticky"

[project.scripts]
sticky = "sticky.cli.app:app"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sticky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
